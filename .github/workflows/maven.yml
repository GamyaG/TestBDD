name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted  # 👈 This ensures it uses your self-hosted runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests with Maven
        run: mvn clean test

      - name: Debug – List files to confirm report presence
        run: dir /s  # 👈 changed from `ls -R` to Windows equivalent

      - name: Copy screenshots into reports folder
        run: |
          mkdir reports\screenshots
          xcopy /E /I screenshots reports\screenshots

      - name: Upload Extent Reports (with screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: reports/
